name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default every job to the minimum permission required to check out and build
# the repository. Individual jobs can add narrowly scoped permissions below.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux build needs GTK/WebKit; the core tests do not, so on
      # Linux we test the core crate only and leave the app to the Windows job.
      - name: Test core (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p cerberus-core
      - name: Test workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace

  lint:
    name: Clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (core, deny warnings)
        run: cargo clippy -p cerberus-core --all-targets -- -D warnings

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check uses the token to report vulnerable dependencies.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz-smoke:
    name: Fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run the header parser fuzzer briefly
        run: cargo +nightly fuzz run header -- -max_total_time=60 -runs=2000000
