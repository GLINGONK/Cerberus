[workspace]
members = ["core", "app/src-tauri"]
# The fuzz crate is its own workspace (needs nightly + sanitizers); keep it out.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
