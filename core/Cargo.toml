[package]
name = "cerberus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cryptographic core for the Cerberus password vault"

[dependencies]
# AEAD ciphers
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Block ciphers used in CTR + encrypt-then-MAC
serpent = "0.5"
twofish = "0.7"
camellia = "0.1"
ctr = "0.9"

# Hashing / MAC / KDF
sha1 = "0.10"
sha2 = "0.10"

hmac = "0.12"
hkdf = "0.12"
blake3 = "1.5"
argon2 = "0.5"
region = "3"

# Hygiene
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
getrandom = "0.2"
rand = "0.8"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
blake3 = "1.5"
zeroize = "1.8"

[lints.rust]
unsafe_code = "forbid"
